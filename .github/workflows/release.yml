name: Build, Test & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.2 (without the v prefix)"
        required: true
        default: "0.1.2"
      create_release:
        description: "Create a prerelease with the portable Windows x64 build"
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: PersonalResourceWorkspace.slnx
  APP_PROJECT: src/PersonalResourceWorkspace.App/PersonalResourceWorkspace.App.csproj

jobs:
  test:
    name: Build & test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $v = ""
          if ("$env:GITHUB_REF_TYPE" -eq "tag") {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          if (-not $v) { $v = "${{ inputs.version }}" }
          if (-not $v) { $v = "0.0.0.${{ github.run_number }}" }
          if ($v -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Version '$v' is not in x.y.z form"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$v"
          Write-Host "Building version $v"

      # Restore with the app's implicit RID so the win-x64 runtime pack is
      # downloaded (the App project defaults RuntimeIdentifier to win-x64).
      - name: Restore
        run: dotnet restore "$env:SOLUTION" -r win-x64

      - name: Build
        run: dotnet build "$env:SOLUTION" -c Release --no-restore

      - name: Test
        run: dotnet test "$env:SOLUTION" -c Release --no-build --no-restore

  publish:
    name: Publish Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ needs.test.outputs.version }}"
          dotnet publish "$env:APP_PROJECT" `
            -c Release -r win-x64 --self-contained true `
            -o "artifacts/win-x64" `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:Version=$version `
            -p:FileVersion=$version `
            -p:InformationalVersion=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "artifacts/win-x64/PersonalResourceWorkspace.App.exe")) {
            throw "Published application executable was not found."
          }

      - name: Zip published build
        shell: pwsh
        run: |
          $zip = "artifacts/PersonalResourceWorkspace-win-x64-${{ needs.test.outputs.version }}.zip"
          Compress-Archive -Path "artifacts/win-x64/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -Path "$zip.sha256" -Encoding ascii
          Get-Item $zip, "$zip.sha256" | Select-Object FullName, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalResourceWorkspace-win-x64-${{ needs.test.outputs.version }}
          path: |
            artifacts/PersonalResourceWorkspace-win-x64-${{ needs.test.outputs.version }}.zip
            artifacts/PersonalResourceWorkspace-win-x64-${{ needs.test.outputs.version }}.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [publish, test]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.create_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PersonalResourceWorkspace-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.test.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Personal Resource Workspace ${{ needs.test.outputs.version }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
          body: |
            Предварительная версия для Windows x64. Скачайте ZIP, распакуйте его целиком и запустите PersonalResourceWorkspace.App.exe.
            Архив не подписан цифровой подписью. Автоматического обновления пока нет.
